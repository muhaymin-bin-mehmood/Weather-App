<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WeatherBoard</title>
    <meta name="description" content="Current conditions, a 5-day forecast and a daily morning reminder for the cities you care about." />
    <meta name="theme-color" content="#ece8e0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1518" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      try {
        var t = JSON.parse(localStorage.getItem('wb:settings') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>WeatherBoard needs JavaScript to load the forecast.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
